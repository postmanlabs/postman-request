name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [$default-branch]
  schedule:
    - cron: '0 12 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install with legacy peer deps
        run: npm install --legacy-peer-deps

      - name: Run lint tests
        run: npm run lint

  browser-tests:
    name: Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install with legacy peer deps
        run: npm install --legacy-peer-deps

      - name: Run browser tests
        run: npm run test-browser

  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 18
            os: ubuntu-latest
            experimental: false
          - node-version: 18
            os: windows-latest
            experimental: false
          - node-version: 20
            os: ubuntu-latest
            experimental: true
          - node-version: 20
            os: windows-latest
            experimental: true
          - node-version: latest
            os: ubuntu-latest
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install with legacy peer deps
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm run test-ci
